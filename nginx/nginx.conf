events {}

http {
    # set upgrade for WS requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/mime.types;
    # set binary type for files if not reconize.
    default_type application/octet-stream;
    # unlimited body request size.
    client_max_body_size 0;

    server {
        listen 80;
        # " _ " for catch all requests.
        server_name localhost 127.0.0.1 _;
        client_max_body_size 0;

        # static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control 'public, must-revalidate';
        }

        # media files
        location /media/ {
            alias /app/media/;
        }

        # web socket requests
        location /ws/ {
            proxy_pass http://filmbaz_ws:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_intercept_errors off;
        }

        # http requests
        location / {
            proxy_pass http://filmbaz:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # for warming page
            proxy_intercept_errors on;
        }

        # if conainer is not ready show warming page.
        error_page 502 503 504 =200 /__warming__;

        location = /__warming__ {
            internal;
            alias /app/errors_templates/warming.html;
            default_type text/html;

            # this page should never  be cached.
            add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
        }
    }
}
