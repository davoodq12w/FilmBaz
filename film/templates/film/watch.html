<!DOCTYPE html>
<html lang="fa">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'player/videojs/video-js.min.css' %}">
    <link rel="stylesheet" href="{% static 'player/plugins/overlay/videojs-overlay.css' %}">
    <link rel="stylesheet" href="{% static 'player/plugins/markers/videojs-markers.css' %}">
    <link rel="stylesheet" href="{% static 'player/themes/filmbaz-dark.css' %}">

</head>

<body class="watch-page">

<div id="player-container">

    <div id="seek-backward-indicator" class="seek-indicator">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                 stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="m18.75 4.5-7.5 7.5 7.5 7.5m-6-15L5.25 12l7.5 7.5"/>
            </svg>
        </div>
        <div class="text">-10s</div>
    </div>

    <div id="seek-forward-indicator" class="seek-indicator">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                 stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5"/>
            </svg>
        </div>
        <div class="text">+10s</div>
    </div>

    <video
            id="movie-player"
            class="video-js"
            controls
            preload="auto">

        <source src="{{ episode.file.url }}" type="video/mp4">

    </video>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="{% static 'player/videojs/video.min.js' %}"></script>
<script src="{% static 'player/plugins/hotkeys/videojs.hotkeys.min.js' %}"></script>
<script src="{% static 'player/plugins/overlay/videojs-overlay.min.js' %}"></script>
<script src="{% static 'player/plugins/markers/videojs-markers.min.js' %}"></script>
<script src="{% static 'js/player.js' %}"></script>

</body>
</html>
