<ul>
    {% for item in movie_names %}
        <li class="search-choice">{{ item }}</li>
    {% endfor %}
</ul>

{# when user click on any of the titles, search box filled with that. #}
<script>
    $(".search-choice").click(function () {
        let text = $(this).text()
        $("#search-input").val(text);
        $(".search").submit();
    });
</script>
